; 80486.cfg -- machine configuration for the 80486 simulator.
;
; This file is read by runner.lua at startup and parsed by
; config_parser.lua (INI style: [section], key=value, '#' or ';' comments).
; A missing or malformed file is a fatal startup error; unimplemented options
; print a WARN line and are ignored.
;
; The values below are the documented defaults.

[memory]
; Writes into this window raise "Memory Write Protection Fault".
protect_start=0xF0000
protect_end=0xFFFFF

[disk]
; The sharded DOS image is mounted read-only; write_sector() rejects writes.
read_only=true
; Multi-sector read cap; the INT 13h layer uses the same limit.
max_sectors_per_read=128
; Single-file image path.  disk.lua accepts it as a one-shard chain; an
; explicit --shards= or --dirs= on the runner command line still wins.
image=/80486-simulator/disk/dos212.img

[bios]
; Require the 0xAA55 boot signature in sector 0.
check_boot_signature=true

[watchdog]
; -1 disables the custom timeout watchdog.  N > 0 grants the machine
; N * 0.05 seconds of run time before it is stopped with an error.
max_tick=-1
