name: release-builds

# Builds the release artifacts on every push and on manual dispatch.
#  - branch push : builds every project (CI smoke test, nothing is published)
#  - tag push    : builds that project and refreshes its release
#  - dispatch    : builds the selected project (nothing is published)
# Tags are the project codenames (no version numbers). GitHub does not start a
# run for a tag that is force-moved to another commit, so re-releases of an
# existing tag need a manual dispatch (or delete + recreate the tag).
on:
  push:
  workflow_dispatch:
    inputs:
      project:
        description: project to build
        required: true
        type: choice
        options:
          - highsafe
          - cardkey
          - pylib
          - rpv1
          - unixshell

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  projects:
    name: linux-${{ github.event.inputs.project || github.ref_name }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.project != 'rpv1')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(fromJSON('["highsafe","cardkey","pylib","unixshell"]'), github.ref_name))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/heads/* ]]; then
            for project in highsafe cardkey pylib; do
              python3 tools/build_release.py --project "$project" --out dist/release
            done
            python3 unixshell/tools/release.py --out dist/release
          else
            project="${{ github.event.inputs.project || github.ref_name }}"
            case "$project" in
              highsafe|cardkey|pylib)
                python3 tools/build_release.py --project "$project" --out dist/release
                ;;
              unixshell)
                python3 unixshell/tools/release.py --out dist/release
                ;;
              *)
                echo "unknown project: $project" >&2
                exit 1
                ;;
            esac
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.ref_name }}-artifacts
          path: dist/release/*
          if-no-files-found: error

      - name: publish to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes ""
          gh release upload "$tag" dist/release/* --clobber

  rpv1:
    name: rpv1-${{ github.ref_name }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.project == 'rpv1')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
      || (github.event_name == 'push' && github.ref_name == 'rpv1')
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: build
        shell: pwsh
        run: ./rpv1/poc/build-dist.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: rpv1-${{ github.ref_name }}-artifacts
          path: |
            rpv1/dist/rpv-1.0.0.zip
            rpv1/dist/rpv.lua
            rpv1/dist/rpv-bundle.lua
            rpv1/dist/install.lua
          if-no-files-found: error

      - name: publish to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "" }
          gh release upload $tag rpv1/dist/rpv-1.0.0.zip rpv1/dist/rpv.lua rpv1/dist/rpv-bundle.lua rpv1/dist/install.lua --clobber
