# theme.conf - the prompt themes of ush.
#
# The shell reads this file at start up (see "man theme.conf" and "man theme").
# Everything here is plain ASCII on purpose: the escapes below are written with
# a backslash, not with real control bytes, so the file stays readable and the
# terminal codes are made only while a prompt is drawn.
#
# A theme is one prompt template. "NAME.prompt = VALUE" replaces the template
# of NAME or adds a new theme, "theme = NAME" picks the theme of the session
# (the default is dark). A value in double quotes keeps its blanks, so a prompt
# may end in a space; a bare value is trimmed at both ends.
#
# Template escapes:
#   $NAME  ${NAME}   a shell variable: USER HOST PWD ? and the rest of "set",
#                    an unset variable expands to nothing
#   \e{NAME}         a CraftOS colour: white black red green blue cyan brown
#                    gray lightBlue lightGray orange magenta lime pink yellow
#                    purple
#   \e{}             back to the default colour
#   \$               a literal dollar sign
#   \\               a literal backslash
#
# PS1 wins over the theme while it is set to a non empty value, for instance:
#   export PS1="\e{lime}$USER@$HOST\e{} $PWD \$ "
# "unset PS1" goes back to the theme of this file.
#
# "theme save" writes the themes and the selection of the session back here.

theme = dark

# dark - the default theme: a coloured user and host, a green path
dark.prompt = "\e{lightBlue}$USER\e{white}@\e{yellow}$HOST\e{white}:\e{lime}$PWD\e{}\$ "

# light - the same layout in quiet colours, for a bright screen
light.prompt = "\e{gray}$USER@$HOST\e{white}:\e{blue}$PWD\e{}\$ "
