# sudo behavior and fine-grained command rules
#
# Global options
#   timeout=<seconds>   how long a successful authentication is cached
timeout=300

# Command rules, one rule per line:
#   <user> <host>=(<runas>) <command>[, <command>...]
#
#   <host>      kept for compatibility with the usual sudoers layout; only
#               ALL is meaningful on a single computer and it is not enforced
#   <runas>     comma separated list of target users, or ALL
#   <command>   absolute path of the command as resolved through PATH, with
#               '*' as wildcard, or ALL; when the field contains no '/' it is
#               matched against the command name, which is the only way to
#               allow a shell builtin (ls, cat, ...). A command file may be
#               written with or without its ".lua" extension, so both
#               "/bin/ls" and "/bin/ls.lua" refer to the same command.
#
# Matching is performed by lib/sudorules.lua and used by the sudo builtin:
# a user with at least one rule here is allowed exactly what the rules say;
# if the command does not match, sudo refuses and writes an audit entry.
# A user without any rule here keeps the previous behaviour: sudo is governed
# by membership in /etc/sudoers.
#
# /etc/sudoers, one entry per line:
#   <user>      a user name; '*' is a wildcard, so "py*" covers pyam, py2, ...
#   %<group>    every member of that group
#   # ...       a comment
# Wildcards and group entries are matched the same way the command field above
# is, so the two files of the sudo policy are written in one style.
#
# Examples (uncomment to use):
# guest  ALL=(ALL)  /bin/ls
# guest  ALL=(root) /usr/cmd/*, /bin/cat
# helper ALL=(ALL)  ALL
