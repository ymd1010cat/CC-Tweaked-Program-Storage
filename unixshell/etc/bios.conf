# ush /etc/bios.conf - the setup screen of this machine
#
# Written by the BIOS setup screen (press DEL for the three seconds before the
# shell starts, or run "bios") and by nothing else. Hand editing works too; the
# keys are read at boot.
#
# THE PASSWORD IS SEPARATE FROM A LOGIN PASSWORD, ON PURPOSE
# It is checked before the shell starts, so it cannot depend on the user database
# the shell reads (/etc/passwd). Two further reasons:
#   * a forgotten login password and a forgotten BIOS password are different
#     problems, and reusing one for the other makes each one worse;
#   * the setup screen has to be reachable exactly when the machine is broken,
#     which is when the user database may be the broken part.
#
# The value is a hash (crypto.sha256 of "cc-bios:" .. password), never the
# password itself. Set or clear it from the setup screen; an empty entry clears it.
#
# password=<hash>
#
# ask_password=1 asks for the password BEFORE booting at all: without it the shell
# is not started, and the machine waits at the setup screen. Off unless set here,
# and that default is deliberate -- a machine that will not boot without a password
# is one that cannot be recovered by reinstalling the shell, so turning it on by
# accident is a serious mistake.
#
# ask_password=1
