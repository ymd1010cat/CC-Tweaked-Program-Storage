# ush /etc/pkgstore.conf - rules about package stores that the media cannot hold
#
# A PACKAGE STORE IS A MEDIUM, AND IT SAYS SO ITSELF
# --------------------------------------------------
# A removable medium becomes a package store when its root carries a marker file.
# The marker is written by "pkg store <n>" and removed by "pkg store remove <n>".
# This machine records NO DRIVE LETTER anywhere: a drive letter belongs to the
# drive bay, not to the data, so a medium that is moved to another bay (or
# inserted after a reboot) is still recognised by what it carries instead of
# being confused with whatever disk now sits in the old bay.
#
#   pkg store            list the media that are stores, and the install root
#   pkg store 2          make the medium in drive 2 a store
#   pkg store 2 3        make two of them stores
#   pkg store remove 2   take the marker off that medium
#   pkg store auto       take the marker off every medium
#
# TWO MARKERS, BECAUSE THERE ARE TWO KINDS OF STORE
# ------------------------------------------------
# A machine built in two parts -- the shell on its own disk, its own modules on a
# medium -- has to tell those modules apart from ordinary extra packages. The
# difference is not decoration: one is part of the installation and the other is
# not, so "the medium is not inserted" has to mean two different things.
#
#   .pkgsys     the SYSTEM MODULE store: the modules the shell itself needs
#               (the manual pages, the file transfer, the services, ...).
#               Losing it costs functionality.
#   .pkgstore   an ordinary REMOVABLE PACKAGE store: extra packages that are
#               nice to have. Losing it costs nothing but those packages.
#
# A medium cannot be both: claiming one as the system store replaces the ordinary
# marker, and "pkg store remove" takes off whichever is there. Both kinds are
# searched when a package is read, and a SYSTEM store is searched before an
# ordinary one, so a module the shell depends on is the one that wins when two
# media carry the same name. New packages are never written into a system store:
# that medium holds the installation's own modules, not extras.
#
#   pkg store sys 2      make the medium in drive 2 the system module store
#   pkg store sys        show which medium holds the system modules
#
# This file therefore holds only the rules about the computer itself:
#
# store_required=1 makes a removable store compulsory. An install that would land
# on the computer's own filesystem is refused, and a machine with no store
# inserted fails instead of quietly writing elsewhere. Turned on and off with
# "pkg store required" and "pkg store optional"; "pkg install --store <n> NAME"
# makes a medium a store for one command only and takes the marker off again.
#
# sys_required=1 makes the SYSTEM MODULE store compulsory, for a machine whose
# shell cannot work without the medium its own modules live on. This one WARNS
# rather than refuses: a missing system store is not a rule about where packages
# go, it is a statement that the machine is not complete, and it is reported (by
# "pkg store", by an install, and by pkg.completeness_warning()) instead of
# blocking work that could still be done. Turned on and off with
# "pkg store sys-required" and "pkg store sys-optional".
#
# store_required=1
# sys_required=1
