# psh /etc/boot.conf - rules about this machine that no medium can carry
#
# Both rules are ON unless this file turns them off, so an absent file and an
# empty file mean the same thing: the machine is protected. Only the OFF state is
# ever written, which is why neither key appears here uncommented.
#
#   set -o bootguard / set +o bootguard    refuse to overwrite a boot file
#   set -o noexit    / set +o noexit       refuse to leave the shell
#
# The same two rules are in the BIOS setup screen (press DEL for three seconds at
# power on, or run "bios"), which writes them through lib/protect.lua. There is
# one authority for each rule, so the screen and "set -o" cannot disagree.
#
# WHY THESE LIVE ON THE MACHINE AND NOT ON A MEDIUM
# They are rules about the computer, not about a disk: they have to hold when no
# medium is inserted, and a medium that carried them could be swapped for one that
# did not. This is the same reasoning as /etc/pkgstore.conf.
#
# WHY BOOT FILES ARE PROTECTED
# The machine boots by running files in fixed places (/startup.lua, /usr/psh.lua,
# /firstboot.lua, /lib/*.lua). Overwriting one either stops the computer booting or
# makes it boot something else, and the only way back is to reinstall from outside.
# With removable media in play the dangerous case is ordinary: a file copied off a
# disk lands on a boot path.
#
# A refused write FAILS (status 1) rather than reporting success, so a script does
# not carry on as if the write had happened.
#
# boot_guard=0
#
# WHY THE SHELL CANNOT BE LEFT
# On a console that has to stay up, "exit" is the one command that ends
# everything. Note that this is a rule about the SESSION: a script ending in
# "exit 3", and "psh -c 'exit 3'", both use exit to return a status and are NOT
# affected -- refusing those would break every script and the watchdog.
#
# no_exit=0
