# Pyromputer OS /etc/network.conf
# The package manager's network: where the update server is and which transport
# carries it. /etc/pkg.conf wins over this file for every key both carry. The
# licence gate that used to read this file is gone (2026-10-17); the setup
# marker it left behind is lib/marker.lua.
# server_id : computer ID of the PC that runs pkgserver.lua. The value below is
#             a PLACEHOLDER; replace it with that machine's os.getComputerID().
# offline   : true means "no update server": pkg answers with a reason instead
#             of waiting for a reply, and firstboot writes this file that way
#             when the operator says there is no server.
modem_side=back
server_id=5
offline=false
channel=pkg-repo
key=mysecretpassword

# transport : which stack carries the traffic
#   auto    rpv when the baked in stack under /rpv loads and the modem side has a
#           modem, rednet otherwise (default)
#   rpv     require rpv; a start failure is reported instead of falling back
#   rednet  always rednet
# rpv machines and rednet machines cannot talk to each other: both ends of a
# conversation must use the same transport. rpv needs an address and a channel;
# both default from the modem side and the computer id, so a fleet needs no per
# machine configuration.
transport=auto
rpv_side=back
rpv_cidr=10.0.4.<id>/24
rpv_channel=4700
rpv_mtu=512
# rpv_peer_<id>=<address>   optional static id -> address map, skips discovery
# rpv_peer_5=10.0.4.5
# Reassembly budget of the rpv node. One file transfer datagram can be a dozen IP
# fragments, so the stack's own default (16 entries / 64 KB) is too small for a
# chunked rget/rput: a burst over the byte cap is dropped and the peer goes silent
# until the fragments expire. 128 entries / 512 KB covers a 4 KB chunk at MTU 512.
# Raise rpv_reasm_bytes for larger chunks, or lower chunk_size in /etc/pkg.conf.
rpv_reasm_bytes=524288
rpv_reasm_entries=128
# Size cap of the live node log (/rpv-log.txt), in bytes; 0 turns the cap off.
# The node logs every frame event, so a 200 KB rget/rput pair writes about 14.5 KB
# (measured) and the log otherwise grows for as long as the machine is up -- into a
# disk of about 1 MB, and it is slow to read back over a Minecraft world file system.
# When the live log passes this it is rotated to /rpv-log.txt.1 (one generation,
# replaced on each rotation) and a fresh file is started.
rpv_log_max_bytes=131072